services:
  minio1:
    image: minio/minio:latest
    container_name: minio_1
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio1-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      minio-cluster:

  minio2:
    image: minio/minio:latest
    container_name: minio_2
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio2-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      minio-cluster:

  minio3:
    image: minio/minio:latest
    container_name: minio_3
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio3-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      minio-cluster:

  minio4:
    image: minio/minio:latest
    container_name: minio_4
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio4-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      minio-cluster:


  nginx:
    image: nginx:latest
    container_name: load_balancer
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  data_fetch:
    build:
      context: ../scripts
      dockerfile: ../docker/Dockerfile-fetch
    container_name: data_fetch
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - nginx
    restart: no
    networks:
      minio-cluster:




volumes:
  minio1-data:
  minio2-data:
  minio3-data:
  minio4-data:



networks:
  minio-cluster:
    driver: bridge