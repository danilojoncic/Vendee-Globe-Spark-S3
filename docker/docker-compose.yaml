services:
  minio1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_1
    hostname: minio1
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio1-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      - minio-cluster

  minio2:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_2
    hostname: minio2
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio2-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      - minio-cluster

  minio3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_3
    hostname: minio3
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      - minio-cluster

  minio4:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_4
    hostname: minio4
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio4-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    networks:
      - minio-cluster

  nginx:
    image: nginx:mainline-alpine3.22
    container_name: load_balancer
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [ "CMD", "nc", "-z", "nginx", "9000" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  data_fetch:
    build:
      context: ../scripts
      dockerfile: ../docker/Dockerfile-fetch
    container_name: data_fetch
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  csv_convertor:
    build:
      context: ../scripts
      dockerfile: ../docker/Dockerfile-convert
    container_name: csv_converter
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      nginx:
        condition: service_healthy
      spark-master:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  spark-master:
    image: apache/spark:3.5.7
    container_name: spark-master
    hostname: spark-master
    command: >
      sh -c "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master -h spark-master && tail -f /dev/null"
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  spark-worker-1:
    image: apache/spark:3.5.7
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: >
      sh -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

  spark-worker-2:
    image: apache/spark:3.5.7
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: >
      sh -c "/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - minio-cluster
    restart: no

volumes:
  minio1-data:
  minio2-data:
  minio3-data:
  minio4-data:

networks:
  minio-cluster:
    driver: bridge