services:
  minio1:
    image: minio/minio:latest
    command: server --console-address ":9001" http://minio{1...4}/data
    volumes:
      - minio1-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

  minio2:
